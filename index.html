<body>
<div class="season-band" aria-hidden="true"></div>
<header class="site-header">
  <div class="wrap">
    <p class="site-title"><a href="./index.html" data-i18n="site_title">節気帖</a><span class="site-subtitle" data-i18n="site_subtitle">七十二候・二十四節気</span></p>
    <nav class="site-nav" aria-label="Main">
      <a href="./index.html" aria-current="page" data-i18n="nav_today">今日</a>
      <a href="./koyomi.html" data-i18n="nav_koyomi">七十二候</a>
      <a href="./sekki.html" data-i18n="nav_sekki">二十四節気</a>

    </nav>
    <div class="lang-switch" aria-label="Language">
      <button type="button" data-lang-switch="ja">日本語</button>
      <button type="button" data-lang-switch="zh">中文</button>
      <button type="button" data-lang-switch="en">EN</button>
    </div>
  </div>
  <div class="wrap site-tagline-row">
    <p class="site-tagline" data-i18n="site_tagline">一年を七十二の季節に分ける、いにしえの暦。</p>
  </div>
</header>

<main>
  <div class="wrap">

    <section class="today-sheet">
      <div class="kou-hero" id="kouHero" aria-hidden="false"></div>
      <div class="today-meta">
        <p class="eyebrow" data-i18n="today_current_sekki">今の節気</p>
        <p class="sekki-name">
          <span id="sekkiName"></span>
          <span class="sekki-sub" id="sekkiSeason"></span>
        </p>

        <span class="kou-order-badge" id="kouOrderBadge"></span>
        <p class="kou-reading" id="kouReading"></p>

        <p class="today-dates">
          <span data-i18n="today_period">この候の期間</span>：
          <strong id="kouDates"></strong>
        </p>

        <div class="progress-line" id="progressLine">
          <span class="progress-seg" data-seg="1"></span>
          <span class="progress-seg" data-seg="2"></span>
          <span class="progress-seg" data-seg="3"></span>
        </div>
        <p class="progress-label" id="progressLabel"></p>
      </div>
      <div class="kou-wheel" id="kouWheel"></div>
    </section>

    <section class="intro-strip">
      <h2 data-i18n="intro_title">はじめての方へ</h2>
      <div class="intro-cols">
        <a class="intro-col" href="./sekki.html">
          <h3 data-i18n="intro_sekki_title">二十四節気とは</h3>
          <p data-i18n="intro_sekki_body">太陽の運行を24等分した、季節の大きな節目。</p>
        </a>
        <a class="intro-col" href="./koyomi.html">
          <h3 data-i18n="intro_kou_title">七十二候とは</h3>
          <p data-i18n="intro_kou_body">節気をさらに三分した、五日ごとの小さな季節。</p>
        </a>
        <a class="intro-col" href="./about.html">
          <h3 data-i18n="intro_usage_title">この頁の使い方</h3>
          <p data-i18n="intro_usage_body">毎日開いて、季節の進みと物語をひとつ読む。</p>
        </a>
      </div>
    </section>

    <section class="story-card">
      <h2 data-i18n="today_story_title">季節のものがたり</h2>
      <p class="desc" id="kouDesc"></p>
      <div class="story-grid">
        <div class="story-block">
          <h3 data-i18n="today_food_title">旬の食材</h3>
          <ul class="food-list" id="foodList"></ul>
        </div>
        <div class="story-block">
          <h3 data-i18n="today_flower_title">季の花</h3>
          <p class="flower-name" id="flowerName"></p>
        </div>
      </div>
      <a class="today-sekki-link" id="sekkiReadingLink" href="./sekki.html" data-i18n="today_sekki_reading_link">この節気について読む</a>
    </section>

  </div>
</main>

<footer class="site-footer">
